server:
  port: 0

spring:
  application:
    name: payment-service

  datasource:
    url: jdbc:h2:mem:payment_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop

  kafka:
    bootstrap-servers: localhost:9092

eureka:
  client:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health