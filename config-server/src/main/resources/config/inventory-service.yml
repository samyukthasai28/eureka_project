server:
  port: 8082

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/inventory_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driverClassName: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
  kafka:
    consumer:
      group-id: inventory-service
      auto-offset-reset: earliest

app:
  kafka:
    topics:
      order-placed: order-placed-topic
      inventory-events: inventory-events-topic
      order-compensation: order-compensation-topic

resilience4j:
  circuitbreaker:
    instances:
      inventoryDatabase:
        sliding-window-size: 5
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5000ms
        permitted-number-of-calls-in-half-open-state: 3
  retry:
    instances:
      inventoryDatabase:
        max-attempts: 3
        wait-duration: 500ms
  ratelimiter:
    instances:
      inventoryCheck:
        limit-for-period: 50
        limit-refresh-period: 1s
        timeout-duration: 100ms